depthpro-manual-debug:
    name: DepthPro Manual Debug Build
    max_build_duration: 60
    instance_type: linux_x2
    when:
      changeset:
        includes:
          - '.'
        excludes:
          - '**/*.md'
          - '**/README*'
    environment:
      java: 17
    scripts:
      - name: Set up local.properties
        script: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > "$CM_BUILD_DIR/local.properties"
          
      - name: Clean project
        script: |
          chmod +x ./gradlew
          ./gradlew clean
          
      - name: Build unsigned debug APK
        script: |
          ./gradlew assembleDebug --no-daemon --stacktrace --info
          
      - name: Verify APK generation
        script: |
          if [ -f "app/build/outputs/apk/debug/app-debug.apk" ]; then
            echo "✅ app-debug.apk generated successfully"
            ls -lh app/build/outputs/apk/debug/app-debug.apk
            file app/build/outputs/apk/debug/app-debug.apk
          else
            echo "❌ app-debug.apk not found"
            find . -name "*.apk" -type f || echo "No APK files found"
            exit 1
          fi
          
    artifacts:
      - app/build/outputs/apk/debug/app-debug.apk
      - app/build/outputs/apk/debug/output-metadata.json
      - app/build/outputs/logs/manifest-merger-debug-report.txt
    
